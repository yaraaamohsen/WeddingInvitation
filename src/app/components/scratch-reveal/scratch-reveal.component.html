<section class="content-section-bg d-flex flex-column align-items-center justify-content-center py-5 px-4 text-center">
  <!-- Hand hint -->
  <div class="scratch-hint mb-3 animate__animated animate__fadeIn">
    <div class="hint-ring position-relative d-flex align-items-center justify-content-center mx-auto mb-3">
      <div class="hint-ring__outer position-absolute rounded-circle"></div>
      <div class="hint-ring__inner rounded-circle d-flex align-items-center justify-content-center">
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="#5C2018"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M18 11V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2v0" />
          <path d="M14 10V4a2 2 0 0 0-2-2a2 2 0 0 0-2 2v6" />
          <path d="M10 10.5V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2v8" />
          <path
            d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34
                   l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"
          />
        </svg>
      </div>
    </div>
    <p class="hint-text">Scratch all three circles to continue</p>
  </div>

  <!-- Title -->
  <div class="mb-4 animate__animated animate__fadeInUp">
    <h2 class="font-serif fst-italic fw-normal mb-2" style="font-size: clamp(36px, 8vw, 52px); color: var(--color-primary)">Reveal</h2>
    <p class="text-uppercase" style="font-size: 11px; letter-spacing: 0.15em; color: var(--color-primary)">Scratch to discover the date</p>
  </div>

  <!-- Scratch circles -->
  <div class="d-flex gap-4 gap-md-5 justify-content-center mb-4">
    @for (circle of circles(); track $index) {
      <div class="scratch-circle-wrap animate__animated animate__fadeInUp" [style.animation-delay]="$index * 0.15 + 's'">
        <!-- Revealed label underneath -->
        <div
          class="scratch-circle__label rounded-circle d-flex align-items-center justify-content-center position-absolute top-0 start-0 w-100 h-100"
        >
          <span class="font-serif fw-bold" style="font-size: clamp(18px, 4vw, 24px); color: var(--color-primary)">
            {{ circle.label }}
          </span>
        </div>

        <!-- scratch-gold.png as overlay — erased via canvas on top -->
        <canvas
          #scratchCanvas
          width="150"
          height="150"
          class="scratch-circle__canvas position-absolute top-0 start-0 w-100 h-100 rounded-circle"
          [class.scratched]="circle.scratched"
          (mousedown)="onMouseDown()"
          (mouseup)="onMouseUp()"
          (mouseleave)="onMouseLeave()"
          (mousemove)="onMouseMove($event, $index)"
          (touchstart)="onTouchStart($event)"
          (touchend)="onTouchEnd()"
          (touchmove)="onTouchMove($event, $index)"
        ></canvas>
      </div>
    }
  </div>

  @if (scratchedCount() === dateParts().length) {
    <p class="font-serif fst-italic mt-2 animate__animated animate__bounceIn" style="font-size: clamp(20px, 4vw, 28px); color: var(--color-primary)">
      We're getting married! 🎉
    </p>
  }
</section>
