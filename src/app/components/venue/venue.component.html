<section class="content-section-bg d-flex flex-column align-items-center py-5 px-4 text-center">
  <p class="text-uppercase mb-4 animate__animated animate__fadeInUp ls-2" style="font-size: 11px; color: var(--color-primary)">
    The celebration will take place at
  </p>

  <!-- Stylized Venue Info (Replaced Image) -->
  <div class="venue-ornament mb-5 animate__animated animate__fadeInUp">
    <div class="ornament-line"></div>
    <div class="ornament-icon">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--color-primary)" stroke-width="1">
        <path d="M3 21h18M3 7l9-4 9 4M5 7v14M19 7v14M10 21v-7a2 2 0 0 1 4 0v7" />
      </svg>
    </div>
    <div class="ornament-line"></div>
  </div>

  <h2
    class="fw-bold mb-3 animate__animated animate__fadeInUp font-serif"
    style="font-size: clamp(32px, 6vw, 56px); color: var(--color-primary);"
  >
    {{ config().venueName }}
  </h2>

  @for (line of config().venueAddress; track $index) {
    <p
      class="text-uppercase mb-0 animate__animated animate__fadeInUp ls-2"
      style="font-size: 12px; color: var(--color-primary); line-height: 2"
    >
      {{ line }}
    </p>
  }
  <p
    class="text-uppercase mb-5 animate__animated animate__fadeInUp ls-2"
    style="font-size: 12px; color: var(--color-primary); line-height: 2"
  >
    {{ config().venueCity }}
  </p>

  <div class="date-badge mb-2 animate__animated animate__fadeInUp">
    <p class="font-serif fst-italic mb-0" style="font-size: 28px; color: var(--color-primary)">
      {{config().weddingDate | date:'fullDate'}}
    </p>
  </div>
