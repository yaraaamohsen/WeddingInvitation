<section
  class="bg-white d-flex flex-column align-items-center py-5 px-4 text-center"
>
  <p
    class="text-uppercase mb-4 animate__animated animate__fadeInUp"
    style="font-size: 11px; letter-spacing: 0.15em; color: var(--color-primary)"
  >
    The celebration will take place at
  </p>

  <!-- Venue illustration — replace src with your actual image -->
  <div class="position-relative w-100 mb-4" style="max-width: 672px">
    <img
      src="assets/venue-illustration.png"
      alt="Venue"
      class="w-100 h-auto animate__animated animate__fadeInUp"
    />
    <!-- Badge -->
    <div
      class="position-absolute top-0 end-0 rounded-pill px-3 py-2 shadow"
      style="background: var(--color-primary); max-width: 140px"
    >
      <span
        style="
          font-size: 9px;
          color: #fff;
          letter-spacing: 0.05em;
          display: block;
          line-height: 1.4;
        "
      >
        Extra: custom illustration of your venue
      </span>
    </div>
  </div>

  <h2
    class="fw-bold mb-2 animate__animated animate__fadeInUp"
    style="
      font-size: clamp(24px, 5vw, 48px);
      color: var(--color-primary);
      font-family: var(--font-sans);
    "
  >
    {{ config().venueName }}
  </h2>

  @for (line of config().venueAddress; track $index) {
    <p
      class="text-uppercase mb-0 animate__animated animate__fadeInUp"
      style="
        font-size: 11px;
        letter-spacing: 0.2em;
        color: var(--color-primary);
        line-height: 2;
      "
    >
      {{ line }}
    </p>
  }
  <p
    class="text-uppercase mb-4 animate__animated animate__fadeInUp"
    style="
      font-size: 11px;
      letter-spacing: 0.2em;
      color: var(--color-primary);
      line-height: 2;
    "
  >
    {{ config().venueCity }}
  </p>

  <p
    class="mb-2 animate__animated animate__fadeInUp"
    style="
      font-size: 22px;
      color: var(--color-primary);
      font-family: var(--font-sans);
    "
  >
    September 10, 2027
  </p>

  <p
    class="font-serif fst-italic animate__animated animate__fadeInUp"
    style="font-size: 20px; color: var(--color-primary)"
  >
    Reception to Follow
  </p>
</section>
