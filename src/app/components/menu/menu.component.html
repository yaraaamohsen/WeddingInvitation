<!--
  The original uses a decorative frame image (menu-frame.png).
  Place your frame image in assets/ and wrap the content inside it.
  The clip-path on the inner card mimics the stamp/ticket edge effect.
-->
<section class="d-flex flex-column align-items-center justify-content-center py-5 px-4" style="background-color: var(--color-beige)">
  <div class="position-relative w-100" style="max-width: 480px">
    <!-- Decorative stamp frame — replace with assets/menu-frame.png -->
    <img src="assets/menu-frame.png" alt="" class="w-100 h-auto" />

    <!-- Menu content overlaid on the frame -->
    <div class="position-absolute top-0 start-0 w-100 h-100 d-flex flex-column align-items-center justify-content-center px-5 text-center">
      @for (item of items(); track item.course) {
        <div class="mb-4 animate__animated animate__fadeInUp">
          <h3 class="text-uppercase mb-1" style="font-family: var(--font-sans); font-size: 11px; letter-spacing: 0.2em; color: var(--color-primary)">
            {{ item.course }}
          </h3>
          <p class="mb-0" style="font-size: 11px; color: var(--color-primary)">
            {{ item.name }}
          </p>
          <p class="fst-italic mb-0" style="font-size: 11px; color: var(--color-primary)">
            {{ item.description }}
          </p>
        </div>
      }

      <p class="font-serif fst-italic mt-2" style="font-size: 18px; color: var(--color-primary)">Vini della Tenuta</p>
    </div>
  </div>
</section>
