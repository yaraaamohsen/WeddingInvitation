<section
  id="rsvp"
  class="py-5 px-3"
  style="background-color: var(--color-beige)"
>
  <div class="mx-auto" style="max-width: 560px">
    <!-- Info badge -->
    <div
      class="d-flex align-items-center justify-content-center gap-2 px-3 py-2 rounded-pill mx-auto mb-4 w-fit animate__animated animate__fadeInDown"
      style="
        background: rgba(92, 32, 24, 0.08);
        border: 1px solid rgba(92, 32, 24, 0.15);
        width: fit-content;
      "
    >
      <svg
        width="14"
        height="14"
        viewBox="0 0 24 24"
        fill="none"
        stroke="#5C2018"
        stroke-width="2"
      >
        <circle cx="12" cy="12" r="10" />
        <path d="M12 16v-4M12 8h.01" />
      </svg>
      <span
        style="
          font-size: 11px;
          color: rgba(92, 32, 24, 0.8);
          letter-spacing: 0.05em;
        "
      >
        This form is fully customizable to your needs
      </span>
    </div>

    <!-- Heading -->
    <div class="text-center mb-4 animate__animated animate__fadeInUp">
      <h2
        class="font-serif fst-italic fw-normal"
        style="font-size: clamp(32px, 7vw, 48px); color: var(--color-primary)"
      >
        Confirm your attendance
      </h2>
    </div>

    @if (!submitted()) {
      <!-- Form card -->
      <div
        class="rounded-4 p-4 p-md-5 animate__animated animate__fadeInUp"
        style="
          background: rgba(255, 255, 255, 0.6);
          border: 1px solid rgba(92, 32, 24, 0.1);
        "
      >
        <!-- Full name -->
        <div class="mb-3">
          <label
            class="form-label text-uppercase fw-semibold"
            style="
              font-size: 11px;
              letter-spacing: 0.15em;
              color: var(--color-primary);
            "
          >
            Full Name *
          </label>
          <input
            class="form-control rounded-3"
            style="
              border-color: rgba(92, 32, 24, 0.2);
              color: var(--color-primary);
            "
            placeholder="Your name"
            [ngModel]="name()"
            (ngModelChange)="name.set($event)"
          />
        </div>

        <!-- Email -->
        <div class="mb-3">
          <label
            class="form-label text-uppercase fw-semibold"
            style="
              font-size: 11px;
              letter-spacing: 0.15em;
              color: var(--color-primary);
            "
          >
            Email (optional)
          </label>
          <input
            type="email"
            class="form-control rounded-3"
            style="
              border-color: rgba(92, 32, 24, 0.2);
              color: var(--color-primary);
            "
            placeholder="your@email.com"
            [ngModel]="email()"
            (ngModelChange)="email.set($event)"
          />
        </div>

        <!-- Attending -->
        <div class="mb-3">
          <label
            class="form-label text-uppercase fw-semibold d-block"
            style="
              font-size: 11px;
              letter-spacing: 0.15em;
              color: var(--color-primary);
            "
          >
            Will you attend? *
          </label>
          <div class="d-flex flex-column flex-sm-row gap-2">
            <button
              type="button"
              class="flex-fill py-3 px-4 rounded-3 fw-normal transition-all"
              [ngClass]="
                attending() === 'yes' ? 'btn-attending-active' : 'btn-attending'
              "
              (click)="attending.set('yes')"
            >
              Yes, I'll be there!
            </button>
            <button
              type="button"
              class="flex-fill py-3 px-4 rounded-3 fw-normal transition-all"
              [ngClass]="
                attending() === 'no' ? 'btn-attending-active' : 'btn-attending'
              "
              (click)="attending.set('no')"
            >
              No, I can't make it
            </button>
          </div>
        </div>

        <!-- Message -->
        <div class="mb-4">
          <label
            class="form-label text-uppercase fw-semibold"
            style="
              font-size: 11px;
              letter-spacing: 0.15em;
              color: var(--color-primary);
            "
          >
            Message for the couple (optional)
          </label>
          <textarea
            class="form-control rounded-3"
            rows="3"
            style="
              border-color: rgba(92, 32, 24, 0.2);
              color: var(--color-primary);
            "
            placeholder="Write us a few words..."
            [ngModel]="message()"
            (ngModelChange)="message.set($event)"
          ></textarea>
        </div>

        <!-- Submit -->
        <button
          type="button"
          class="btn w-100 py-3 rounded-3 d-flex align-items-center justify-content-center gap-2"
          style="
            background: var(--color-primary);
            color: var(--color-beige);
            font-size: 13px;
            letter-spacing: 0.1em;
          "
          [disabled]="!isValid"
          (click)="submit()"
        >
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"
            />
            <path d="m21.854 2.147-10.94 10.939" />
          </svg>
          Confirm
        </button>
      </div>
    } @else {
      <div class="text-center animate__animated animate__bounceIn py-5">
        <p
          class="font-serif fst-italic"
          style="font-size: 32px; color: var(--color-primary)"
        >
          Thank you! 🎉
        </p>
        <p style="color: var(--color-muted); font-size: 14px">
          We received your response and can't wait to celebrate with you.
        </p>
      </div>
    }
  </div>
</section>
