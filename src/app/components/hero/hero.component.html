<section class="hero-overlay fixed-top w-100 vh-100 d-flex flex-column align-items-center justify-content-center text-center px-4">
  <div class="hero-content">
    <p class="welcome-text text-uppercase mb-4 animate-fade-in-up">
      Welcome to <br />
      the Wedding
    </p>

    <div class="names-container mb-4">
      <h1 class="groom-name font-serif animate-fade-in" style="animation-delay: 0.5s">
        {{ config().groomName }}
      </h1>
      <span class="ampersand font-serif animate-fade-in" style="animation-delay: 0.8s">&</span>
      <h1 class="bride-name font-serif animate-fade-in" style="animation-delay: 1.1s">
        {{ config().brideName }}
      </h1>
    </div>

    <p class="invitation-sentence animate-fade-in-up" style="animation-delay: 1.5s">
      We invite you to celebrate <br />
      our love and the beginning of our new life together.
    </p>
  </div>

  <!-- Scroll Hint - only shows after intro animations -->
  <div class="scroll-hint mb-5 animate-fade-in" style="animation-delay: 2.5s">
    <p class="text-uppercase small ls-2 mb-2">Scroll to discover</p>
    <svg class="scroll-arrow"
         width="24"
         height="24"
         viewBox="0 0 24 24"
         fill="none"
         stroke="currentColor"
         stroke-width="2"
         stroke-linecap="round"
         stroke-linejoin="round">
      <polyline points="7 13 12 18 17 13"></polyline>
      <polyline points="7 6 12 11 17 6"></polyline>
    </svg>
  </div>
</section>
