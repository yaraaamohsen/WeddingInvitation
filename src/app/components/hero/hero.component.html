<!-- hero.component.html -->
<section class="hero position-relative vh-100 w-100 overflow-hidden">
  <!-- ① Background — only this stays absolute -->
  <img src="assets/curtain-open.jpg" alt="" class="hero__bg position-absolute top-0 start-0 w-100 h-100" />

  <!-- ② Flexbox overlay: top eyebrow · center names · bottom text + arrow -->
  <div class="hero__overlay position-absolute top-0 start-0 w-100 h-100 d-flex flex-column align-items-center justify-content-between px-4 pt-5 pb-4">
    <!-- Spacer pushes names to true center -->
    <div class="flex-grow-1 d-flex flex-column align-items-center justify-content-center text-center animate__animated animate__fadeIn hero__names">
      <p class="hero__eyebrow text-uppercase mb-4">You are cordially invited to<br />celebrate the wedding of</p>

      <h1 class="hero__name font-serif fst-italic fw-normal mb-0 lh-1">
        {{ config().groomName }}
      </h1>

      <span class="hero__ampersand font-serif fst-italic d-block">&amp;</span>

      <h1 class="hero__name font-serif fst-italic fw-normal mb-0 lh-1">
        {{ config().brideName }}
      </h1>
    </div>

    <!-- Bottom area: body text + scroll arrow stacked -->
    <div class="d-flex flex-column align-items-center gap-4 w-100">
      <p class="hero__body text-uppercase text-center animate__animated animate__fadeIn animate__delay-1s mb-0">
        We would like to invite you to celebrate with us the most special day of our lives. It would be an honor to have you present at this important
        moment.
      </p>

      <div class="d-flex flex-column align-items-center animate__animated animate__fadeInUp animate__infinite animate__slow">
        <p class="hero__scroll-label text-uppercase mb-2">Scroll</p>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#5C2018" stroke-width="1.5">
          <path d="M12 5v14M5 12l7 7 7-7" />
        </svg>
      </div>
    </div>
  </div>
</section>
