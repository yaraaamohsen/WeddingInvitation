<app-confetti [active]="showConfetti()" />

<!-- (1) Welcome Cinematic Overlay - Fixed at the top -->
<app-hero [config]="config()" />

<!-- (2) Scrollable Content Sections -->
<!-- We add a Spacer so the Welcome text is seen first, then user scrolls past it -->
<div class="scroll-container">
  <div class="viewport-spacer"></div>

  <app-scratch-reveal [dateParts]="config().dateParts" (allScratched)="onAllScratched()" />

  @if (showRest()) {
    <app-countdown [weddingDate]="config().weddingDate" />
    <app-venue [config]="config()" />
    <app-dress-code />
    <app-thank-you [groomName]="config().groomName" [brideName]="config().brideName" />
  }
</div>
