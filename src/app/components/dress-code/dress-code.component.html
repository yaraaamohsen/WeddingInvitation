<section class="content-section-bg d-flex flex-column align-items-center py-5 px-4 text-center">
  <h2
    class="text-uppercase fw-bold mb-5 animate__animated animate__fadeInUp ls-3"
    style="font-size: clamp(32px, 6vw, 48px); color: var(--color-primary); font-family: var(--font-sans)"
  >
    Dress Code
  </h2>

  <!-- Replaced illustration with a cinematic quote or icon -->
  <div class="dress-code-visual mb-5 animate__animated animate__fadeInUp">
    <div class="visual-circle">
       <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="var(--color-gold)" stroke-width="0.75">
         <path d="M20.38 3.46L16 2a4 4 0 01-8 0L3.62 3.46a2 2 0 00-1.62 2V11a10 10 0 0010 10 10 10 0 0010-10V5.46a2 2 0 00-1.62-2z" />
       </svg>
    </div>
  </div>

  <p class="mb-5 animate__animated animate__fadeInUp" style="max-width: 560px; font-size: 16px; line-height: 2; color: var(--color-primary); font-family: var(--font-serif); font-style: italic;">
    We invite you to dress elegantly and formally to celebrate this special day with us.
  </p>

  <div class="attire-label animate__animated animate__fadeInUp mb-4">
    <p class="text-uppercase fw-bold mb-0 ls-2" style="font-size: 20px; color: var(--color-gold);">
      Formal Attire
    </p>
  </div>

  <p class="font-serif fst-italic animate__animated animate__fadeInUp" style="font-size: 22px; color: var(--color-muted)">
    Please avoid wearing white
  </p>
</section>
