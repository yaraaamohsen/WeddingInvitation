<!-- (1) Video-Only Curtain System (Persistent Background) -->
<app-curtain (curtainDone)="onCurtainDone()" />

<!-- (2) Content Section - Scrolls Above the Video -->
<main class="content-layer" [class.content-layer--active]="isCurtainDone()">
  <!-- We only show InvitationComponent once the curtain has opened -->
  @if (isCurtainDone()) {
    <app-invitation [config]="config" />
  }
</main>
